name: Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  review:
    name: Code Review (Codex)
    # Skips fork PRs:
    # - they get no OIDC token, so they can't assume the Bedrock role
    # - only authors with write access can trigger model spend
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: macos-gh
    timeout-minutes: 20
    outputs:
      findings: ${{ steps.review.outputs.findings }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The model can read the workspace, so the token must not stay in the checked out repository's git config.
      - name: Checkout review action
        uses: actions/checkout@v4
        with:
          repository: pubnub/client-engineering-deployment-tools
          ref: feat/code-review
          token: ${{ secrets.GH_TOKEN }}
          path: .github/.release/actions
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Review pull request
        id: review
        uses: ./.github/.release/actions/actions/code-review/review
        with:
          bedrock-role-arn: ${{ secrets.BEDROCK_ROLE_ARN }}
          bedrock-region: ${{ secrets.BEDROCK_REGION }}
          model: ${{ secrets.CODEX_MODEL }}

  post:
    name: Post review comments
    needs: review
    if: needs.review.outputs.findings != ''
    runs-on:
      group: macos-gh
    timeout-minutes: 10
    # The only job with the write token:
    #
    # - it never runs a model
    # - it only posts the validated findings
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout review action
        uses: actions/checkout@v4
        with:
          repository: pubnub/client-engineering-deployment-tools
          ref: feat/code-review
          token: ${{ secrets.GH_TOKEN }}
          path: .github/.release/actions
          persist-credentials: false

      - name: Post review
        uses: ./.github/.release/actions/actions/code-review/post
        with:
          findings: ${{ needs.review.outputs.findings }}
